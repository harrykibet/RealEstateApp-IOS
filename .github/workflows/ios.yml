name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-26

    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 🔥 Dynamically select latest Xcode (no hardcoding)
    - name: Select latest Xcode
      run: |
        set -e

        echo "Available Xcode versions:"
        ls -d /Applications/Xcode*.app || true

        LATEST_XCODE=$(ls -d /Applications/Xcode_*.app \
          | sort -V \
          | tail -n 1)

        if [ -z "$LATEST_XCODE" ]; then
          echo "❌ No Xcode installations found"
          exit 1
        fi

        echo "✅ Using: $LATEST_XCODE"

        sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

    # 🔍 Toolchain observability (critical for debugging CI drift)
    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version

    # 🚨 Guardrail: ensure expected Swift version (optional but recommended)
    - name: Verify Swift toolchain
      run: |
        swift --version | grep "6.2" || {
          echo "❌ Expected Swift 6.2 toolchain not found"
          exit 1
        }

    # ⚡ Optimized SwiftPM caching (safe + scalable)
    - name: Cache SwiftPM
      uses: actions/cache@v4
      with:
        path: |
          ~/.swiftpm
          ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-

    # ⚡ Optional: cache DerivedData separately (faster builds, but isolated)
    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: build
        key: derived-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          derived-${{ runner.os }}-

    # 🔥 Explicit dependency resolution (deterministic builds)
    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project estatia.xcodeproj

    # 🏗️ Build (no code signing in CI)
    - name: Build for testing
      run: |
        xcodebuild clean build-for-testing \
          -project estatia.xcodeproj \
          -scheme estatia \
          -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

    # 🧪 Run tests
    - name: Run tests
      run: |
        xcodebuild test-without-building \
          -xctestrun build/Build/Products/*.xctestrun \
          -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
          | xcpretty

    # 📦 Upload build artifacts (debugging failures)
    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcode-build-logs
        path: |
          build
          ~/Library/Logs/DiagnosticReports