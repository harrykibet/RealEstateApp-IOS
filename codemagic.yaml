workflows:
  ios-native:
    name: Native iOS
    max_build_duration: 120
    instance_type: mac_studio_m4_max

    environment:
      xcode: 27

      groups:
        - tokens
        - firebase

      vars:
        GIT_USER_NAME: harrykibet
        GIT_USER_EMAIL: trmnjames@gmail.com
        REMOTE_GITHUB_NAME: github
        REMOTE_GITLAB_NAME: gitlab
        GITHUB_REPO: harrykibet/RealEstateApp-IOS.git
        GITLAB_REPO: harrykibet/RealEstateApp-IOS.git
        SSH_KEY_PATH: "$HOME/.ssh/id_ed25519_ci"

        XCODE_PROJECT: estatia.xcodeproj
        XCODE_SCHEME: estatia
        DERIVED_DATA: "$CM_BUILD_DIR/build"

    scripts:

      # =========================
      # 🔐 SSH SETUP
      # =========================
      - name: Setup ephemeral SSH keys
        script: |
          set -euxo pipefail
          echo "Setting up SSH keys..."
          python3 -m pip install --quiet requests
          chmod +x scripts/ssh_key_manager.py
          python3 scripts/ssh_key_manager.py

      # =========================
      # 🔥 GIT SETUP (NO CLEAN YET)
      # =========================
      - name: Setup Git identity & remotes
        script: |
          set -euxo pipefail
          echo "Running Git setup..."
          chmod +x scripts/git_setup.sh
          chmod +x scripts/update_repos.sh
          ./scripts/git_setup.sh

      # =========================
      # 🧹 CLEAN ONLY AFTER GIT SETUP
      # =========================
      - name: Clean repository state
        script: |
          set -euxo pipefail
          echo "Cleaning repo..."
          git clean -fdx
          git status --porcelain

      # =========================
      # 🔐 RESTORE FIREBASE PLIST (AFTER CLEAN)
      # =========================
      - name: Restore GoogleService-Info.plist
        script: |
          set -euxo pipefail

          echo "Restoring Firebase plist..."

          FILE_PATH="$CM_BUILD_DIR/estatia/GoogleService-Info.plist"
          mkdir -p "$(dirname "$FILE_PATH")"

          echo "$GOOGLE_SERVICES_PLIST_B64" | base64 --decode > "$FILE_PATH"

          echo "Validating plist..."
          test -f "$FILE_PATH"
          test -s "$FILE_PATH"

          plutil -lint "$FILE_PATH"

          echo "File details:"
          ls -la "$FILE_PATH"
          shasum -a 256 "$FILE_PATH"

          echo "Firebase plist successfully restored."

      # =========================
      # 🔍 VERIFY PLIST STILL EXISTS
      # =========================
      - name: Verify Firebase plist presence
        script: |
          set -euxo pipefail

          FILE="$CM_BUILD_DIR/estatia/GoogleService-Info.plist"

          echo "Checking plist after setup steps..."

          if [ ! -f "$FILE" ]; then
            echo "❌ Firebase plist missing"
            exit 1
          fi

          ls -la "$FILE"

      # =========================
      # 🖥 DISPLAY BOOTSTRAP
      # =========================
      - name: Bootstrap virtual display
        script: |
          set -euxo pipefail
          echo "Initializing CI display environment..."
          chmod +x scripts/ci-display-bootstrap.sh
          ./scripts/ci-display-bootstrap.sh

      # =========================
      # 📦 RESOLVE SPM
      # =========================
      - name: Resolve Swift Package Dependencies
        script: |
          set -euxo pipefail
          echo "Resolving Swift Package dependencies..."

          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/spm"

      # =========================
      # 🏗 BUILD
      # =========================
      - name: Build for testing
        script: |
          set -euxo pipefail

          DESTINATION="platform=iOS Simulator,OS=latest,name=iPhone 15"

          echo "Building project..."

          xcodebuild clean build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallelizeTargets \
            CODE_SIGNING_ALLOWED=NO

      # =========================
      # 🔍 VALIDATE BUILD OUTPUT
      # =========================
      - name: Validate build artifacts
        script: |
          set -euxo pipefail

          echo "Validating build output..."

          APP_PATH=$(find "$DERIVED_DATA" -name "*.app" | head -n 1)

          if [ -d "$APP_PATH" ]; then
            echo "✅ App build found: $APP_PATH"
          else
            echo "❌ ERROR: No .app produced"
            exit 1
          fi

      # =========================
      # 🧪 TESTS
      # =========================
      - name: Run tests (optional)
        script: |
          set -euxo pipefail

          DESTINATION="platform=iOS Simulator,OS=latest,name=iPhone 15"

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA"

      # =========================
      # 🧹 CLEANUP SSH
      # =========================
      - name: Cleanup SSH
        script: |
          set -euxo pipefail
          python3 scripts/ssh_key_manager.py cleanup

    artifacts:
      - build/**/*.app
      - build/**/*.dSYM

    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true
