name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    # =========================
    # 📥 Checkout
    # =========================
    - name: Checkout repository
      uses: actions/checkout@v4

    # =========================
    # 🧠 Force Xcode 26.2
    # =========================
    - name: Select Xcode 26.2
      run: |
        set -e

        echo "🔍 Checking installed Xcode versions:"
        ls -d /Applications/Xcode*.app || true

        XCODE_PATH="/Applications/Xcode_26.2.app"

        if [ ! -d "$XCODE_PATH" ]; then
          echo "❌ Xcode 26.2 not found at $XCODE_PATH"
          exit 1
        fi

        echo "✅ Using: $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

    # =========================
    # 🔍 Toolchain verification
    # =========================
    - name: Print toolchain info
      run: |
        xcodebuild -version
        swift --version

    # 🚨 Fail fast if wrong toolchain is active
    - name: Validate Xcode version
      run: |
        xcodebuild -version | grep "26.2"

    # =========================
    # ⚡ SwiftPM Cache
    # =========================
    - name: Cache SwiftPM
      uses: actions/cache@v4
      with:
        path: |
          ~/.swiftpm
          ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

    # =========================
    # 📦 Resolve Dependencies
    # =========================
    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project estatia.xcodeproj

    # =========================
    # 🧪 Build for testing
    # =========================
    - name: Build for testing
      run: |
        xcodebuild clean build-for-testing \
          -project estatia.xcodeproj \
          -scheme estatia \
          -destination "platform=iOS Simulator, OS=26.2, name=iPhone 17 Pro" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

    # =========================
    # 🧪 Run tests
    # =========================
    - name: Run tests
      run: |
        xcodebuild test-without-building \
          -xctestrun build/Build/Products/*.xctestrun \
          -destination "platform=iOS Simulator, OS=26.2, name=iPhone 17 Pro"

    # =========================
    # 📦 Artifacts on failure
    # =========================
    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcode-build-logs
        path: |
          build
          ~/Library/Logs/DiagnosticReports