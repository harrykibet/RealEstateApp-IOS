name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        set -e
        LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
        sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Cache SwiftPM
      uses: actions/cache@v4
      with:
        path: |
          ~/.swiftpm
          ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project estatia.xcodeproj

    # 🔥 Dynamic simulator selection
    - name: Select simulator
      id: sim
      run: |
        DEVICE=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\(.*\)//')
        echo "destination=platform=iOS Simulator,name=$DEVICE" >> $GITHUB_OUTPUT

    - name: Build for testing
      run: |
        xcodebuild clean build-for-testing \
          -project estatia.xcodeproj \
          -scheme estatia \
          -destination "${{ steps.sim.outputs.destination }}" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: |
        xcodebuild test-without-building \
          -xctestrun build/Build/Products/*.xctestrun \
          -destination "${{ steps.sim.outputs.destination }}"