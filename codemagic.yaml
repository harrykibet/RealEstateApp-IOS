workflows:
  ios-native:
    name: Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        GITHUB_TOKEN: "$GITHUB_TOKEN"
        GITLAB_TOKEN: "$GITLAB_TOKEN"
        XCODE_PROJECT: "estatia.xcodeproj"
        XCODE_SCHEME: "estatia"
        DERIVED_DATA: "$CM_BUILD_DIR/build"

    scripts:

      # =========================
      # 🔥 GIT SETUP
      # =========================
      - name: Setup Git environment
        script: |
          echo "Setting up Git..."
          chmod +x scripts/git_setup.sh
          ./scripts/git_setup.sh

      # =========================
      # 🔥 CLEAN STATE
      # =========================
      - name: Clean repository state
        script: |
          echo "Cleaning repo..."
          git clean -fdx

      # =========================
      # 🔥 SSH SETUP
      # =========================
      - name: Setup ephemeral SSH (GitHub/GitLab)
        script: |
          echo "Setting up ephemeral SSH access..."

          python3 -m pip install requests

          chmod +x scripts/ssh_key_manager.py
          python3 scripts/ssh_key_manager.py "$GITHUB_TOKEN" "$GITLAB_TOKEN"

      # =========================
      # 🔥 DISPLAY BOOTSTRAP
      # =========================
      - name: Bootstrap virtual display
        script: |
          echo "Initializing CI display environment..."
          chmod +x scripts/ci-display-bootstrap.sh
          ./scripts/ci-display-bootstrap.sh

      # =========================
      # 🔥 RESOLVE SPM
      # =========================
      - name: Resolve Swift Package Dependencies
        script: |
          echo "Resolving Swift Package dependencies..."
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/spm"

      # =========================
      # 🔥 BUILD
      # =========================
      - name: Build for testing
        script: |
          set -e

          DESTINATION="platform=iOS Simulator,OS=latest,name=iPhone 15"

          echo "Building project..."

          xcodebuild clean build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallelizeTargets \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # =========================
      # 🔥 VERIFY
      # =========================
      - name: Validate build artifacts
        script: |
          echo "Validating build output..."

          APP_PATH=$(find "$DERIVED_DATA" -name "*.app" | head -n 1)

          if [ -d "$APP_PATH" ]; then
            echo "✅ App build found: $APP_PATH"
          else
            echo "❌ ERROR: No .app produced"
            exit 1
          fi

      # =========================
      # 🔥 TESTS
      # =========================
      - name: Run tests (optional)
        script: |
          set -e

          DESTINATION="platform=iOS Simulator,OS=latest,name=iPhone 15"

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA"

      # =========================
      # 🔥 CLEANUP
      # =========================
      - name: Cleanup SSH keys
        script: |
          echo "Cleaning up SSH keys..."
          python3 scripts/ssh_key_manager.py cleanup "$GITHUB_TOKEN" "$GITLAB_TOKEN"

    artifacts:
      - build/**/*.app
      - build/**/*.dSYM

    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true