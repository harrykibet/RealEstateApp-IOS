workflows:
  ios_build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        CI: "true"  # Define CI environment variable for Xcode optimization
        BITRISE_PROJECT_PATH: "estatia.xcodeproj"
        BITRISE_SCHEME: "estatia"
        BITRISE_DISTRIBUTION_METHOD: "ad-hoc"
      groups:
        - apple_signing  # Stores provisioning profiles and certificates for signing
    scripts:
      - name: Set Xcode location
        script: |
          sudo xcode-select -s /Applications/Xcode-16.3.app

      - name: Resolve Swift Package Manager dependencies
        script: |
          echo "Resolving Swift Package Manager dependencies..."
          xcodebuild -resolvePackageDependencies -project "$BITRISE_PROJECT_PATH"

      - name: Clean & Build for testing (using xcodebuild)
        script: |
          xcodebuild clean build-for-testing \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -derivedDataPath build
            
    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true
