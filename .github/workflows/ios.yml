name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15 # macOS 15 runners support latest Xcode versions

    env:
      BITRISE_PROJECT_PATH: estatia.xcodeproj
      BITRISE_SCHEME: estatia
      BITRISE_DISTRIBUTION_METHOD: ad-hoc

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'

    - name: Select Xcode 16.3
      run: sudo xcode-select -s /Applications/Xcode_16.3.app

    - name: Restore SwiftPM cache
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          .build
        key: spm-${{ hashFiles('**/Package.resolved') }}

    - name: Build for testing
      run: |
        xcodebuild clean build-for-testing \
          -project "$BITRISE_PROJECT_PATH" \
          -scheme "$BITRISE_SCHEME" \
          -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
          -derivedDataPath build
          
    - name: Run tests
      run: |
        xcodebuild test-without-building \
          -xctestrun build/Build/Products/*.xctestrun \
          -destination "platform=iOS Simulator,name=iPhone 16 Pro"
